spring:
  application:
    name: metrology-service
  profiles:
    active: ${OS:default}           # come sensor-manager: OS=raspberrypi sulla Pi

  # Stessa istanza PostgreSQL di sensor-manager, ma schema e utente propri: il servizio non vede
  # le tabelle di public, e quello che gli serve lo chiede per evento o per REST.
  # URL, utente e password arrivano da SPRING_DATASOURCE_URL, _USERNAME e _PASSWORD.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # lo schema lo modificano solo le migrazioni Flyway
    properties:
      hibernate.default_schema: metrology

  flyway:
    schemas: metrology
    default-schema: metrology
    # Lo schema lo crea una volta sola lo script in db/setup, con il suo proprietario. Se manca,
    # l'avvio deve fallire: crearlo qui significherebbe crearlo con l'utente sbagliato.
    create-schemas: false

  # Tutti i messaggi sono JSON scritti e letti con ContractJson: sul filo viaggiano come testo.
  # Il tombstone di `calibration-activated` e' un valore nullo, che un serializzatore JSON non
  # saprebbe rappresentare.
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

  servlet:
    multipart:
      max-file-size: 20MB           # un certificato PDF o un DCC firmato [S §5.8]
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080

metrology:
  # Rodaggio: l'amministratore puo' correggere e cancellare i ruoli metrologici, le verifiche
  # intermedie e il numero di serie di un campione, che in esercizio restano immutabili. Va
  # spento prima di emettere certificati veri; ogni correzione resta comunque nel registro.
  run-in: ${METROLOGY_RUN_IN:false}
  # sensor-manager risponde a chi possiede una MU: il servizio gli inoltra il token di chi
  # chiama, e cosi' la proprieta' la decide il servizio che la conosce.
  sensor-manager:
    url: ${SENSOR_MANAGER_URL:http://172.20.0.10:8080}
  documents:
    max-bytes: 20971520             # 20 MB [S §5.8]
  signing:
    # Il keystore PKCS#12 con chiave e certificato di firma, montato in sola lettura, e il file
    # con la sua password. Senza, la firma non e' disponibile (vedi dev-self-signed).
    keystore: ${SIGNING_KEYSTORE:}
    password-file: ${SIGNING_PASSWORD_FILE:}
    # Solo per sviluppo: una chiave generata all'avvio, che vive in memoria e non vale niente
    # fuori da questo processo. Sulla Pi resta spenta.
    dev-self-signed: ${SIGNING_DEV_SELF_SIGNED:false}
    # Le CA di cui ci si fida nella verifica: certificati .crt/.pem/.cer in questa cartella.
    trust-anchors-path: ${SIGNING_TRUST_ANCHORS:/app/trust}
  certificates:
    # Quanto vale un certificato se ne' l'esemplare ne' il template dicono altrimenti.
    default-interval-days: 365
    # L'orizzonte entro cui un certificato in vigore risulta «in scadenza».
    expiring-horizon-days: 90
  # Fase 4: promemoria dello scadenzario (90, 30 e 0 giorni) e avvisi di non conformita'.
  # La posta parte solo se c'e' un server SMTP (spring.mail.host, per esempio SPRING_MAIL_HOST,
  # con SPRING_MAIL_PORT, SPRING_MAIL_USERNAME e SPRING_MAIL_PASSWORD); senza, gli avvisi
  # restano nel log e nell'interfaccia (badge e coda delle non conformita').
  notifications:
    # La casella del laboratorio; i clienti ricevono all'indirizzo dei membri della loro azienda.
    lab-email: ${METROLOGY_LAB_EMAIL:}
    from: ${METROLOGY_MAIL_FROM:metrology@localhost}
  schedule:
    # Il ricalcolo notturno delle scadenze (oltre a quello a ogni attivazione).
    cron: "0 30 2 * * *"
